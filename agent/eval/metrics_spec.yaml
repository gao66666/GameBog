# GoBlog Agent 测评指标（已定稿：只保留可自动化、对门禁有用的项）
#
# 用法：
#   日常 CI / 发版前：run_agent_eval.py + run_tool_eval.py  → gates.daily
#   改检索 / 发版：     run_memory_eval.py / run_kb_rag_eval.py → gates.release_*
#   抽样质量：         scripts/audit_turns.py（LLM，不进 batch_pass）

# ── P0 日常门禁（~10–14 次 /chat，规则可算）────────────────────────────
gates:
  daily:
    desc: "E2E turn_cases + tool_cases；失败即挡合并"
    metrics:
      - id: case_pass_rate
        desc: "用例断言全过占比"
        source: aggregate_batch
      - id: task_completion_rate
        desc: "有实质回复、非 clarify/cannot、工具无失败"
        source: score_turn.task_completed
      - id: stream_ok_rate
        desc: "SSE 正常结束 status=ok"
        source: score_turn.stream_ok
      - id: route_match_rate
        desc: "public/user/general 路由符合用例"
        source: score_turn.route_match
      - id: tool_selection_accuracy
        desc: "有工具时 tools_match；tool_eval 用 tool_scorer 细项"
        source: aggregate_batch / tool_scorer
      - id: tool_execution_success_rate
        desc: "有工具时全部 tools[].ok"
        source: score_turn.tools_all_ok
      - id: total_ms_p95
        desc: "端到端耗时 P95（毫秒）"
        source: turn.timings.total_ms
      - id: usage_total_tokens
        desc: "done.usage.total_tokens；仅观测/报表，暂不参与 batch_pass"
        source: SSE done.usage
        gate: false
    thresholds: &daily_thresholds
      case_pass_rate_min: 0.85
      task_completion_rate_min: 0.88
      stream_ok_rate_min: 0.95
      route_match_rate_min: 0.90
      tool_selection_accuracy_min: 0.92
      tool_execution_success_rate_min: 0.98
      tool_ok_rate_min: 0.98          # 与 tool_execution_success_rate 同义，兼容旧键
      total_ms_p95_max: 45000

  tool_eval:
    desc: "run_tool_eval.py；工具专测批次"
    metrics:
      - case_pass_rate
      - tool_args_match_rate
      - tool_selection_accuracy
      - tool_execution_success_rate
    thresholds: &tool_thresholds
      case_pass_rate_min: 0.90
      tool_args_match_rate_min: 0.85
      tool_selection_accuracy_min: 0.92
      tool_execution_success_rate_min: 0.98

  release_memory:
    desc: "改长期记忆检索时跑 run_memory_eval.py"
    metrics:
      - recall_at_k      # Context Recall 代理
      - mrr              # Context Precision 代理
    thresholds: &memory_thresholds
      case_pass_rate_min: 0.80
      mean_recall_at_k_min: 0.90
      mean_mrr_min: 0.50

  release_kb_rag:
    desc: "改 KB 分块/embedding 时跑 run_kb_rag_eval.py"
    metrics:
      - recall_at_k
      - mrr
    thresholds: &kb_rag_thresholds
      case_pass_rate_min: 0.70
      mean_recall_at_k_min: 0.90
      mean_mrr_min: 0.50

  ab_compare:
    desc: "run_ab_eval.py；对照实验回归"
    thresholds: &ab_thresholds
      min_pass_rate_delta: -0.05
      min_task_completion_rate_delta: -0.05
      max_regression_cases: 1
      max_p95_ms_increase: 8000
      max_avg_total_ms_increase: 5000

# ── 脚本读取的阈值别名（勿删，与 gates.*.thresholds 一致）────────────
thresholds: *daily_thresholds
tool_thresholds: *tool_thresholds
memory_thresholds: *memory_thresholds
kb_rag_thresholds: *kb_rag_thresholds
ab_thresholds: *ab_thresholds

# ── 单条 turn 字段（scorer 产出）────────────────────────────────────
metrics:
  stream_ok: { tier: P0, gate: daily }
  route_match: { tier: P0, gate: daily }
  tools_match: { tier: P0, gate: daily, alias: tool_selection_accuracy }
  tools_all_ok: { tier: P0, gate: daily, alias: tool_execution_success_rate }
  task_completed: { tier: P0, gate: daily }
  timing_total_ms: { tier: P0, gate: daily, aggregate: total_ms_p95 }
  usage: { tier: P0, gate: false, note: "total_tokens 仅记录" }
  tool_call_count: { tier: observability }
  timing_execute_ms: { tier: observability }
  retrieval_latency_ms: { tier: observability, note: "有 retrieve 的 turn 才看" }
  orch_cycles: { tier: observability }
  pipeline_ok: { tier: P0, gate: dialogue_e2e, note: "改写→路由→tool_retrieve→analyse→plan→执行→成稿" }
  pipeline_pass_rate: { tier: P0, gate: dialogue_e2e, source: aggregate_batch }

# tool_scorer 细项（仅 tool_cases）
tool_accuracy:
  tool_first_match: { tier: tool_eval }
  tool_args_match: { tier: tool_eval }
  tool_retrieve_match: { tier: tool_eval }

# ── 暂缓 / 抽样（不进日常 batch_pass）────────────────────────────────
deferred:
  - id: answer_relevance
    method: llm_judge
    script: audit_turns.py
  - id: answer_faithfulness
    method: llm_judge
  - id: hallucination_rate
    method: llm_judge
  - id: context_relevance
    method: llm_judge
  - id: multi_step_coherence
    method: llm_judge
    note: "orch_cycles>=2 的 turn 可抽样送审"
  - id: cost_per_query_usd
    note: "usage.total_tokens × 单价，待配置单价后再门禁"

# ── 批次汇总字段（aggregate_batch 输出）──────────────────────────────
batch_aggregate:
  case_pass_rate: {}
  task_completion_rate: {}
  stream_ok_rate: {}
  route_match_rate: {}
  tool_selection_accuracy: {}
  tool_execution_success_rate: {}
  tool_ok_rate: {}
  avg_total_ms: { gate: false }
  total_ms_p95: {}
  total_ms_p99: { gate: false }
  retrieval_latency_p95_ms: { gate: false }
