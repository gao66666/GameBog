# 公共知识库 RAG 召回测评

# chunk_index 规则见 kb_rag_corpus.yaml（section*100+part）；也可用 expected_sections 按章节断言

# 前置: python agent/scripts/seed_kb_eval.py --dry-run



defaults:

  k: 10

  min_recall_at_k: 1.0

  min_mrr: 0.15

  require_hit_at_k: true



cases:

  - id: kb_elden_intro

    name: 艾尔登-游戏名片

    query: "交界地开放世界魂系列艾尔登法环是什么游戏"

    memory_hints: ["艾尔登法环", "交界地"]

    expect:

      expected_sections:

        - { article_id: game:elden-ring, section: 游戏名片 }



  - id: kb_elden_gameplay

    name: 艾尔登-玩法

    query: "艾尔登法环骑马探索Boss联机怎么玩"

    memory_hints: ["玩法", "托雷特"]

    expect:

      expected_sections:

        - { article_id: game:elden-ring, section: 玩法 }



  - id: kb_elden_requirements

    name: 艾尔登-配置

    query: "艾尔登法环PC推荐配置显卡内存"

    memory_hints: ["配置", "RTX"]

    expect:

      expected_sections:

        - { article_id: game:elden-ring, section: 配置需求 }



  - id: kb_elden_tips

    name: 艾尔登-注意事项

    query: "艾尔登法环新手死亡卢恩灵马哨笛建议"

    memory_hints: ["新手", "卢恩"]

    expect:

      expected_sections:

        - { article_id: game:elden-ring, section: 注意事项 }



