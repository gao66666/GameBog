# 公共知识库 RAG 召回测评
# chunk_index 规则见 kb_rag_corpus.yaml（section*100+part）；也可用 expected_sections 按章节断言
# 前置: python agent/scripts/seed_kb_eval.py --dry-run

defaults:
  k: 10
  min_recall_at_k: 1.0
  min_mrr: 0.3
  require_hit_at_k: true
  require_forbidden_clean: true

cases:
  - id: kb_elden_intro
    name: 艾尔登-简介
    query: "交界地开放世界魂系列艾尔登法环是什么游戏"
    memory_hints: ["艾尔登法环", "交界地"]
    expect:
      expected_sections:
        - { article_id: game:elden-ring, section: 简介 }

  - id: kb_elden_gameplay
    name: 艾尔登-玩法
    query: "艾尔登法环骑马探索Boss联机怎么玩"
    memory_hints: ["玩法", "托雷特"]
    expect:
      expected_sections:
        - { article_id: game:elden-ring, section: 玩法 }
      forbidden_sections:
        - { article_id: game:apex, section: 玩法 }

  - id: kb_elden_requirements
    name: 艾尔登-配置
    query: "艾尔登法环PC推荐配置显卡内存"
    memory_hints: ["配置", "RTX"]
    expect:
      expected_sections:
        - { article_id: game:elden-ring, section: 配置需求 }

  - id: kb_elden_tips
    name: 艾尔登-注意事项
    query: "艾尔登法环新手死亡卢恩灵马哨笛建议"
    memory_hints: ["新手", "卢恩"]
    expect:
      expected_sections:
        - { article_id: game:elden-ring, section: 注意事项 }

  - id: kb_bg3_gameplay
    name: 博德之门3-玩法
    query: "博德之门3回合制DND对话检定怎么玩"
    memory_hints: ["博德之门", "回合制"]
    expect:
      expected_sections:
        - { article_id: game:bg3, section: 玩法 }

  - id: kb_sekiro_gameplay
    name: 只狼-玩法弹刀
    query: "只狼架势弹刀忍杀复活怎么打"
    memory_hints: ["只狼", "弹刀"]
    expect:
      expected_sections:
        - { article_id: game:sekiro, section: 玩法 }

  - id: kb_genshin_gameplay
    name: 原神-元素玩法
    query: "原神元素反应蒸发融化深境螺旋"
    memory_hints: ["原神", "元素"]
    expect:
      expected_sections:
        - { article_id: game:genshin, section: 玩法 }

  - id: kb_hades_gameplay
    name: 哈迪斯-玩法祝福
    query: "哈迪斯Roguelike奥林匹斯祝福构筑"
    memory_hints: ["哈迪斯", "祝福"]
    expect:
      expected_sections:
        - { article_id: game:hades, section: 玩法 }

  - id: kb_apex_gameplay
    name: APEX-玩法
    query: "APEX三人小队战术大逃杀传奇技能"
    memory_hints: ["APEX", "传奇"]
    expect:
      expected_sections:
        - { article_id: game:apex, section: 玩法 }
      forbidden_sections:
        - { article_id: game:elden-ring, section: 玩法 }

  - id: kb_cross_lore
    name: 防混淆-背景
    query: "黄金树破碎战争半神玛丽卡交界地"
    memory_hints: ["背景", "黄金树"]
    expect:
      expected_sections:
        - { article_id: game:elden-ring, section: 游戏背景 }
      forbidden_sections:
        - { article_id: game:apex, section: 游戏背景 }
