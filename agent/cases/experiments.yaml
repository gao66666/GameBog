# A/B 实验定义：同一 case 集在 control / treatment 上各跑一遍后对比
#
# 用法：
#   1) 启动 control 配置下的 Agent（如默认 prompts）
#   2) python agent/scripts/run_ab_eval.py run --variant control --out eval_ab/control.json
#   3) 改 prompts/config 并重启 Agent
#   4) python agent/scripts/run_ab_eval.py run --variant treatment --out eval_ab/treatment.json
#   5) python agent/scripts/run_ab_eval.py compare eval_ab/control.json eval_ab/treatment.json
#
# 若 treatment 跑在另一端口，在 variants 里改 agent_url

suite: turn_cases
case_filter: []

variants:
  control:
    label: control
    agent_url: "http://127.0.0.1:9091"
  treatment:
    label: treatment
    agent_url: "http://127.0.0.1:9091"

thresholds:
  min_pass_rate_delta: -0.05
  min_task_completion_rate_delta: -0.05
  max_regression_cases: 1
  max_p95_ms_increase: 8000
  max_avg_total_ms_increase: 5000
