# Agent 直连测评用例（POST /chat，从 SSE v1 fact 聚合成 turn 再断言）
# token 留空表示不带登录；需要 user 组时请填环境变量或 --token

defaults:
  max_total_ms: 45000

cases:
  - id: general_time
  name: 通用-时间
  message: "现在几点"
  token: ""
  expect:
    status: ok
    servers_must_include: [general]
    servers_must_exclude: [user]
    tools_any: [get_current_time]
    disposition_any: [answer, proceed, clarify, cannot]
    max_total_ms: 20000

  - id: general_calc
  name: 通用-计算
  message: "123乘以456等于多少"
  token: ""
  expect:
    status: ok
    servers_must_include: [general]
    tools_any: [calculate]
    disposition_any: [answer, proceed, clarify, cannot]

  - id: public_search
  name: 公开-搜文章
  message: "帮我搜一下 Go 语言相关的博客文章"
  token: ""
  expect:
    status: ok
    servers_must_include: [public]
    servers_must_exclude: [user]
    tools_min_count: 1
    tools_any: [search_articles]
    disposition_any: [answer, proceed, clarify, cannot]
    max_total_ms: 45000

  - id: chat_greeting
  name: 闲聊
  message: "你好，介绍一下你能做什么"
  token: ""
  expect:
    status: ok
    disposition_any: [answer, proceed]
    tools_max_count: 0
    max_total_ms: 35000

  - id: user_collections_no_token
  name: 未登录-我的收藏（应不选 user）
  message: "我的收藏里有什么"
  token: ""
  expect:
    status: ok
    servers_must_exclude: [user]
    max_total_ms: 45000

  # 以下需要 JWT：运行时 --token 或在此填写
  - id: user_wallet
  name: 登录-积分
  message: "我的积分余额是多少"
  token: ""
  require_token: true
  expect:
    status: ok
    servers_must_include: [user]
    tools_min_count: 1
    tools_any: [me_get_wallet]
    disposition_any: [answer, proceed, clarify, cannot]
    max_total_ms: 45000
