# 工具调用准确性测评（端到端 POST /chat）
#
# 工具名与 shared/tools_registry.json 一致（如 me_get_wallet，非 HTTP 方法名）。
# expect 常用字段：
#   tools_must_include / tools_must_exclude / tool_must_first
#   tool_retrieve_must_include
#   tool_args.{tool}: {field}_contains | _regex | _present | keys_present
#   max_tool_calls / require_token / servers_must_include|exclude
#
# 带 require_token 的 case 需: --token <JWT> 或 AGENT_EVAL_TOKEN

defaults:
  max_total_ms: 45000
  disposition_any: [answer, close, proceed]

cases:
  # ── general（3）──
  - id: tool_time_exact
    name: 通用-当前时间
    message: "现在几点了"
    expect:
      status: ok
      servers_must_include: [general]
      tool_must_first: get_current_time
      tools_must_include: [get_current_time]
      tools_must_exclude: [search_articles, me_get_wallet]
      max_tool_calls: 2

  - id: tool_calc_expr
    name: 通用-四则运算
    message: "123乘以456等于多少"
    expect:
      status: ok
      servers_must_include: [general]
      tools_must_include: [calculate]
      tool_args:
        calculate:
          expression_contains: "123"
          keys_present: [expression]
      tools_must_exclude: [search_articles]
      max_tool_calls: 2

  - id: tool_text_stats
    name: 通用-字数统计
    message: "帮我统计一下这段话有多少字：今天天气不错，适合写博客。"
    expect:
      status: ok
      servers_must_include: [general]
      tools_must_include: [text_stats]
      tool_args:
        text_stats:
          keys_present: [text]
          text_contains: "天气"
      max_tool_calls: 2

  # ── public / 文章（5）──
  - id: tool_search_articles
    name: 公开-搜索文章
    message: "搜一下 Go 语言相关的博客文章"
    expect:
      status: ok
      servers_must_include: [public]
      servers_must_exclude: [user]
      tools_must_include: [search_articles]
      tool_retrieve_must_include: [search_articles]
      tool_args:
        search_articles:
          query_contains: "Go"
          keys_present: [query]
      max_tool_calls: 3

  - id: tool_list_latest
    name: 公开-最新文章
    message: "最近发布了哪些新博客文章，列几条最新的"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [list_latest_articles]
      tool_retrieve_must_include: [list_latest_articles]
      max_tool_calls: 3

  - id: tool_article_leaderboard
    name: 公开-文章排行榜
    message: "按浏览量看看文章排行榜前几名"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_article_leaderboard]
      max_tool_calls: 3

  - id: tool_article_detail
    name: 公开-文章详情
    message: "帮我查看文章 ID 为 1 的详细内容"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_article_detail]
      tool_args:
        get_article_detail:
          article_id_present: true
      max_tool_calls: 4

  - id: tool_article_comments
    name: 公开-文章评论
    message: "文章 1 下面有哪些评论"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_article_comments]
      tool_args:
        get_article_comments:
          article_id_present: true
      max_tool_calls: 4

  # ── public / 话题（3）──
  - id: tool_list_topics
    name: 公开-话题列表
    message: "博客上有哪些话题可以讨论"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [list_all_topics]
      max_tool_calls: 3

  - id: tool_topic_detail
    name: 公开-话题详情
    message: "话题 ID 1 的详情是什么"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_topic_detail]
      tool_args:
        get_topic_detail:
          topic_id_present: true
      max_tool_calls: 4

  - id: tool_topic_articles
    name: 公开-话题下文章
    message: "话题 1 下面关联了哪些文章"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_topic_articles]
      tool_args:
        get_topic_articles:
          topic_id_present: true
      max_tool_calls: 4

  - id: tool_topic_discussions
    name: 公开-话题讨论
    message: "话题 1 里大家在讨论什么"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_topic_discussions]
      tool_args:
        get_topic_discussions:
          topic_id_present: true
      max_tool_calls: 4

  # ── public / 游戏（3）──
  - id: tool_list_games
    name: 公开-游戏库
    message: "游戏库里都有哪些游戏"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [list_all_games]
      max_tool_calls: 3

  - id: tool_game_detail
    name: 公开-游戏详情
    message: "查看游戏 ID 1 的详细介绍"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_game_detail]
      tool_args:
        get_game_detail:
          game_id_present: true
      max_tool_calls: 4

  - id: tool_game_reviews
    name: 公开-游戏点评
    message: "游戏 1 的玩家点评有哪些"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_include: [get_game_reviews]
      tool_args:
        get_game_reviews:
          game_id_present: true
      max_tool_calls: 4

  - id: tool_user_public_profile
    name: 公开-用户资料
    message: "查一下用户 ID 2 的公开主页资料"
    expect:
      status: ok
      servers_must_include: [public]
      tools_must_exclude: [me_get_wallet, me_get_profile]
      tools_must_include: [get_user_public_profile]
      tool_args:
        get_user_public_profile:
          user_id_present: true
      max_tool_calls: 4

  # ── user / 需登录（6）──
  - id: tool_me_wallet
    name: 登录-积分余额
    message: "我的积分余额是多少"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_wallet]
      max_tool_calls: 3

  - id: tool_me_profile
    name: 登录-我的资料
    message: "我的个人资料是什么"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_profile]
      max_tool_calls: 3

  - id: tool_me_collections
    name: 登录-我的收藏
    message: "我收藏了哪些文章"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_collections]
      max_tool_calls: 3

  - id: tool_me_articles
    name: 登录-我的文章
    message: "我发布过哪些博客文章"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_articles]
      max_tool_calls: 3

  - id: tool_me_followed_topics
    name: 登录-关注话题
    message: "我关注了哪些话题"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_followed_topics]
      max_tool_calls: 3

  - id: tool_me_game_plays
    name: 登录-游戏记录
    message: "我的游戏游玩记录有哪些"
    require_token: true
    expect:
      status: ok
      servers_must_include: [user]
      tools_must_include: [me_get_game_plays]
      max_tool_calls: 3

  # ── 负例 / 边界（4）──
  - id: tool_no_false_positive
    name: 闲聊-零工具
    message: "你好"
    expect:
      status: ok
      tools_max_count: 0
      max_tool_calls: 0
      tools_must_exclude: [search_articles, calculate, me_get_wallet]

  - id: tool_collections_no_token
    name: 未登录-收藏不选user
    message: "我的收藏里有什么文章"
    token: ""
    expect:
      status: ok
      servers_must_exclude: [user]
      tools_must_exclude: [me_get_collections, me_get_wallet]
      max_tool_calls: 2

  - id: tool_calc_not_search
    name: 计算勿误搜
    message: "(100+50)*2 等于多少"
    expect:
      status: ok
      tools_must_include: [calculate]
      tools_must_exclude: [search_articles]
      max_tool_calls: 2

  - id: tool_search_not_wallet
    name: 搜索勿误调积分
    message: "搜索一下 Python 教程相关的文章"
    expect:
      status: ok
      servers_must_exclude: [user]
      tools_must_include: [search_articles]
      tools_must_exclude: [me_get_wallet, calculate]
      max_tool_calls: 3
