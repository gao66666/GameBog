# 多轮对话 E2E：15 短 + 15 长，POST /chat 走完整链路（改写→路由→分析→计划→执行→成稿）
# 短对话：单句简洁提问；长对话：同一主题下的长表述（配置+玩法、背景+新手建议等），不拼无关意图
# 覆盖：general | public | user（JWT）| 公共 KB RAG（≥50%）
# 运行: python agent/scripts/run_dialogue_metrics_eval.py [--token JWT]

defaults:
  user_id: 88001
  expect:
    status: ok
    require_task_completed: true
    require_full_pipeline: true
    disposition_any: [answer, proceed, clarify, cannot]

sessions:
  - id: short_15
    name: 短对话 15 轮
    chat_session_id: eval_short_15
    max_total_ms: 55000
    kb_expectations:
      - {}
      - {}
      - {}
      - {expected_sections: [{article_id: "game:elden-ring", section: "游戏名片"}]}
      - {}
      - {expected_sections: [{article_id: "game:genshin", section: "玩法"}]}
      - {}
      - {expected_sections: [{article_id: "game:apex", section: "玩法"}]}
      - {}
      - {expected_sections: [{article_id: "game:bg3", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:sekiro", section: "玩法"}]}
      - {}
      - {expected_sections: [{article_id: "game:hades", section: "游戏名片"}]}
      - {expected_sections: [{article_id: "game:cyberpunk2077", section: "配置需求"}]}
      - {}
    turns:
      - message: "现在北京时间几点"
        expect:
          servers_must_include: [general]
          tools_any: [get_current_time]
      - message: "156 乘以 89 等于多少"
        expect:
          servers_must_include: [general]
          tools_any: [calculate]
      - message: "帮我搜一下 Go 语言相关的博客文章"
        expect:
          servers_must_include: [public]
          servers_must_exclude: [user]
          tools_any: [search_articles]
      - message: "艾尔登法环是什么类型的游戏"
        expect:
          servers_must_exclude: [user]
      - message: "博客最新文章有哪些，列几条标题就行"
        expect:
          servers_must_include: [public]
          tools_any: [list_latest_articles]
      - message: "原神的元素反应玩法有哪些"
      - message: "游戏库里有哪些游戏"
        expect:
          servers_must_include: [public]
          tools_any: [list_all_games]
      - message: "APEX 英雄怎么玩"
      - message: "1024 除以 8 等于多少"
        expect:
          servers_must_include: [general]
          tools_any: [calculate]
      - message: "博德之门3的战斗是回合制吗"
      - message: "只狼的弹刀机制是怎么回事"
      - message: "话题列表里有哪些热门话题"
        expect:
          servers_must_include: [public]
          tools_any: [list_all_topics]
      - message: "哈迪斯是什么类型的游戏"
      - message: "赛博朋克2077的配置要求高吗"
      - message: "我的积分余额是多少"
        require_token: true
        expect:
          servers_must_include: [user]
          tools_any: [me_get_wallet]

  - id: long_15
    name: 长对话 15 轮
    chat_session_id: eval_long_15
    max_total_ms: 120000
    # 长对话 = 单轮表述更长；复合意图须同一主题（如配置+玩法、背景+新手建议），不拼无关 general 工具
    kb_expectations:
      - {expected_sections: [{article_id: "game:godofwar", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:elden-ring", section: "配置需求"}]}
      - {expected_sections: [{article_id: "game:rdr2", section: "游戏背景"}]}
      - {expected_sections: [{article_id: "game:witcher3", section: "游戏名片"}, {article_id: "game:witcher3", section: "配置需求"}, {article_id: "game:witcher3", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:genshin", section: "配置需求"}, {article_id: "game:genshin", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:sekiro", section: "玩法"}, {article_id: "game:sekiro", section: "注意事项"}]}
      - {expected_sections: [{article_id: "game:bg3", section: "注意事项"}]}
      - {expected_sections: [{article_id: "game:apex", section: "配置需求"}, {article_id: "game:apex", section: "玩法"}, {article_id: "game:apex", section: "注意事项"}]}
      - {expected_sections: [{article_id: "game:cyberpunk2077", section: "玩法"}, {article_id: "game:cyberpunk2077", section: "配置需求"}]}
      - {expected_sections: [{article_id: "game:godofwar", section: "玩法"}, {article_id: "game:sekiro", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:elden-ring", section: "游戏背景"}]}
      - {expected_sections: [{article_id: "game:hades", section: "配置需求"}, {article_id: "game:hades", section: "注意事项"}]}
      - {expected_sections: [{article_id: "game:rdr2", section: "注意事项"}]}
      - {expected_sections: [{article_id: "game:bg3", section: "配置需求"}, {article_id: "game:bg3", section: "玩法"}]}
      - {expected_sections: [{article_id: "game:elden-ring", section: "游戏名片"}, {article_id: "game:bg3", section: "游戏名片"}]}
    turns:
      - message: >
          我最近在纠结要不要入坑《战神》2018，听说战斗风格和前几代差别很大。
          你能具体讲讲这作的玩法特点吗？比如战斗节奏、武器系统和地图探索大概是怎么设计的？
      - message: >
          想换电脑玩《艾尔登法环》，现在的机子有点老了。
          百科里流畅运行大概需要什么档次的配置？最低配和推荐配之间体验差多少？
      - message: >
          朋友一直推荐《荒野大镖客2》，我对美国西部题材挺感兴趣。
          这款游戏的故事背景大概讲什么、时代和世界观是怎样设定的？
      - message: >
          没玩过前作的话，《巫师3》还值得入手吗？
          它算哪类游戏、对电脑配置要求高不高，核心玩法更偏剧情还是偏动作？
      - message: >
          《原神》我听说挺吃配置，元素反应玩法也复杂。
          中等画质想稳定玩大概要什么显卡，日常配队里元素反应一般怎么搭配？
      - message: >
          《只狼》一直听说很难，我想先了解它的核心玩法机制，
          以及新手刚上手有哪些特别需要注意、容易卡关的地方？
      - message: >
          我打算第一次玩《博德之门3》这类 CRPG，之前没什么同类经验。
          开局和前期流程里有哪些新手容易踩坑、后面会后悔的选择？
      - message: >
          笔记本想试玩《APEX 英雄》，不知道能不能跑得动。
          最低配置大概什么水平，进游戏后主要有哪些模式，新号有什么要注意的？
      - message: >
          《赛博朋克2077》现在值得认真玩一遍吗？
          不同流派/build 玩法差别大不大，对显卡和内存大概是什么要求？
      - message: >
          《战神》2018 和《只狼》都是动作游戏，我更喜欢有剧情节奏又能练操作的。
          这两个哪个更难、玩法风格和上手体验差在哪里？
      - message: >
          《艾尔登法环》的世界观我一直没理顺，
          它的游戏背景整体讲了怎样的故事，交界地和那些半神之间是什么关系？
      - message: >
          《哈迪斯》这种 Roguelike 会不会特别吃配置？
          第一次玩的话，有什么习惯或机制需要提前知道，才能少踩坑？
      - message: >
          《荒野大镖客2》开放世界很大，我刚开始玩，
          新手期有哪些机制或习惯值得注意，避免后期走弯路？
      - message: >
          我想从头到尾认真通关《博德之门3》，
          合适的电脑配置是什么，以及从开局到推主线的大致玩法流程是怎样的？
      - message: >
          我想先看看收藏夹里有没有游戏攻略类的文章，
          另外帮我对比一下《艾尔登法环》和《博德之门3》分别是什么类型、玩法上差在哪。
        require_token: true
        expect:
          servers_must_include: [user]
          tools_any: [me_get_collections]
