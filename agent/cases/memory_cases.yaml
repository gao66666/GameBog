# 长期记忆检索精度（离线直调 get_long_term_context，不经过 LLM）
#
# 使用前请为 eval_user_id 写入可识别的记忆条目，并填写 expected_ids。
# id 格式：mongo 用 fingerprint；qdrant 用 point_id；或 "mongo:fp_xxx" / "qdrant:uuid"
#
# 示例（需替换为真实 ID）：
#   expected_ids: ["mongo:abc123...", "qdrant:550e8400-..."]
#   forbidden_ids: ["mongo:noise_fact_001"]

defaults:
  k: 10
  min_recall_at_k: 0.5
  min_precision_at_k: 0.3
  require_hit_at_k: true
  require_forbidden_clean: true

# eval_user_id 默认 0 表示用环境变量 AGENT_EVAL_USER_ID
eval_user_id: 0

cases:
  - id: memory_seed_placeholder
    name: 占位-需配置种子与 ID
    skip: true
    user_id: 0
    query: "我喜欢玩什么游戏"
    memory_hints: ["游戏", "爱好"]
    expect:
      k: 10
      expected_ids: []
      min_recall_at_k: 1.0
      require_hit_at_k: true
