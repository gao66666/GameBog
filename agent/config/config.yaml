# Agent 对话模型提示词：同目录 prompts.yaml，保存后按文件 mtime 热加载，无需重启进程。
#
# 对话 LLM：DeepSeek（OpenAI 兼容）
#   环境变量 DEEPSEEK_API_KEY 或 LLM_API_KEY（优先于下方 api_key）
#   申请：https://platform.deepseek.com/
#
# Embedding：DeepSeek 不提供向量 API，仍用智谱 embedding-3（或其它 OpenAI 兼容 embedding）
#   环境变量 ZHIPU_API_KEY 或 EMBEDDING_API_KEY

llm:
  base_url: "https://api.deepseek.com"
  api_key: ""  # 通过环境变量 DEEPSEEK_API_KEY 或 LLM_API_KEY 设置
  model: "deepseek-chat"
  temperature: 0.7
  thinking: false

summary_llm:
  base_url: "https://api.deepseek.com"
  api_key: ""  # 同上，不设则继承 llm.api_key
  model: "deepseek-chat"
  temperature: 0
  thinking: false

memory_manager_llm:
  base_url: "https://api.deepseek.com"
  api_key: ""  # 同上
  model: "deepseek-chat"
  temperature: 0
  thinking: false

decision_llm:
  base_url: "https://api.deepseek.com"
  api_key: ""  # 同上
  model: "deepseek-chat"
  temperature: 0
  thinking: false

blog_api_url: "http://127.0.0.1:8084/api/v1"

# 可与 Go 博客 Redis 使用不同实例：HTTP 短期上下文由网关从 goblog:agent:chat:* 注入请求；
# 此处仅服务 Agent 本机 agent:short:* / agent:mid:* 等。Docker 内可设 REDIS_HOST=redis 或独立 redis 服务。
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# 向量维度须与 embedding.dimensions 一致。若曾用 1536 建过库，需删集合或换新 collection 名后重建。
qdrant:
  url: "http://127.0.0.1:6333"
  user_memory_collection: "goblog_user_memory"
  kb_collection: "goblog_kb_documents"
  vector_size: 1024

embedding:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  api_key: ""  # 通过环境变量 ZHIPU_API_KEY 或 EMBEDDING_API_KEY 设置
  model: "embedding-3"
  dimensions: 1024

mongo:
  uri: "mongodb://root:123456@localhost:27017/?authSource=admin"
  database: "goblog_long_term"
  collection: "memory_facts"

# 非空时 POST /memory/ingest-document 须在请求头携带 X-Ingest-Key 与之相同；也可用环境变量 DOCUMENT_INGEST_SECRET
document_ingest_secret: ""

memory:
  short_ttl_minutes: 60
  mid_ttl_days: 7
  mid_max_items: 8
  mid_facts_max_items: 10
  mid_facts_max_chars: 560
  mid_fact_max_chars_per_item: 180
  short_window_messages: 12
  long_term_retrieval_limit: 10
  mongo_rule_preference_limit: 5
  mongo_retrieval_candidate_cap: 80
  memory_hints_max_items: 8
  memory_hints_max_chars: 64
  session_idle_timeout_minutes: 30
  summary_enabled: true
  hybrid_search: true
  hybrid_prefetch_limit: 48
  # Hybrid：Dense 与 Sparse 分数各自 min-max 后加权相加（非 Qdrant RRF；sparse 侧即 hybrid_keyword_weight）
  # hybrid_rrf_k: 60  # 已弃用
  # Sparse 重排（融合前）：hint 词面分与 BM25 分归一化后相加
  hint_rerank_enabled: true
  hint_rerank_hint_weight: 0.65
  hint_rerank_bm25_weight: 0.35
  hybrid_dense_weight: 0.50
  hybrid_keyword_weight: 0.50
  hybrid_keyword_recall: true

orchestration:
  tool_retrieval_enabled: true
  tool_retrieval_top_k: 10
  tool_retrieval_min_pool_for_skip: 4
  tool_retrieval_dense_weight: 0.65
  tool_retrieval_keyword_weight: 0.35
  tool_retrieval_fallback_all: true
  dynamic_tool_injection: true
  max_orchestration_cycles: 1
  post_turn_async_log: true

turn_audit:
  sample_size: 5
  max_turn_json_chars: 14000
