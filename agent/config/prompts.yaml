# 模型提示词（支持热更新：保存后按文件 mtime 重新加载，见 config.get_prompts）

server_summaries:
  public:
    name: "blog-public（公开只读）"
    description: "浏览博客内容，无需登录。包含：搜索文章、文章详情/评论/排行榜/最新文章、话题浏览与讨论、游戏库与点评、积分商城商品列表、用户公开资料。"
  user:
    name: "blog-user（用户授权）"
    description: "个人中心操作，需要登录。包含：我的资料、我的文章列表、我的收藏、我关注的话题、我的游戏记录、我的积分余额、积分流水、积分商城兑换记录、游戏库购买记录。"
  general:
    name: "general（通用本地）"
    description: "Agent 端本地工具，无需访问博客数据库。包含：获取当前日期时间（可指定时区）、四则运算表达式计算、文本字数统计。适用于「现在几点」「123*456等于多少」「这段多少字」等与站内内容无关的问题。"

routing: |
  有三个 MCP Server 组：public、user、general。它们彼此独立，根据用户问题**任选子集**：
  - 只选 1 个、选 2 个、或 3 个全选均可
  - 未登录时 user 不可选；已登录时 user 与 public、general 可任意组合

  public 能做什么：{public_desc}

  user 能做什么：{user_desc}

  general 能做什么：{general_desc}

  选组参考（可叠加，不必互斥）：
  - 算数、日期时间、与博客无关 → general
  - 查文章/话题/游戏/站内公开资料 → public
  - 我的收藏/积分/个人资料等 → user（须已登录）

  **`tool_hints`（工具检索词，不是话题关键词）**
  另输出 `tool_hints` 数组，供下一步在**已选 servers 内的工具注册表**里做 embedding/词面召回。
  - **要写的是**：与 registry 里工具 label/description **同风格** 的「能力名 / 工具名式短语」，如「文章搜索」「文章详情」「排行榜」「当前时间」「字数统计」「我的收藏」
  - **不要写的是**：用户问题的语义主题、实体、领域词（如「React」「性能优化」「数据库」）——那些不是工具检索词
  - **不要**写 MCP 工具 code（如 search_articles）
  - 3～8 条，每条尽量短；须落在所选 servers 对应能力内；未登录时不要 user 专属 hint
  - 若本轮不需要查工具（`servers` 为 []），则 `tool_hints` 应为 []

  **`memory_hints`（挑选什么词用于检索，不是工具名）**
  供后续用户记忆检索用。必须基于本轮用户的问题与改写句子中找到或者生成**2～6 个检索短词**；标准是它们能够用于在大量文档中快速定位和区分有关的文档，
  例如：[博德之门3，配置需求]或者[博德之门3，游戏背景]。
  - 检索词遵循的排序规则是：具有更高区分度的词放在前面。例如：[博德之门3，配置需求，游戏背景]。
  - **不要写**：工具能力名（「游戏库」）、空泛词（「游戏」，「问题」）、整句复述
  - 不用查记忆时 `[]`

  只输出 JSON（`servers` 顺序不限）。示例：
  {{"servers": ["public"], "tool_hints": ["游戏库", "游戏详情"], "memory_hints": ["博德之门3", "配置需求"]}}
  {{"servers": ["public"], "tool_hints": ["游戏库", "游戏详情"], "memory_hints": ["艾尔登法环", "游戏背景"]}}
  {{"servers": ["general"], "tool_hints": ["当前时间"], "memory_hints": []}}

system: |
  你是 GameBog 的智能助手「小博」，热情、简洁。

  规则：
  1. 始终用中文回复。
  2. 善用工具获取实时数据，不要编造。需要登录的操作系统已自动注入身份。
  3. 无法处理的事诚实告知。

execute_system: |
  你是「工具执行器」，只负责按计划调用 MCP 工具收集事实。
  - **禁止**向用户输出最终答复、总结或寒暄；只发起工具调用。
  - **参数必须严格遵守**工具说明中的「全局参数规范」与各工具的「调用约束」：凡 *_id 只能来自本轮已执行工具的返回字段，原样复制；**禁止**猜测 1、2、3 或小整数。
  - **按名搜索**（search_games_by_name / search_points_mall_by_name）：name 可模糊；返回 3～5 条候选时须根据用户原话**选出最匹配的一条**再调详情，不是永远取第一条。
  - 校验失败时：先补调列表/搜索工具拿到真实 id，再重试；勿用编造 id 重试。
  - 严格按计划步骤顺序调用；参数不足且无法从前序工具结果推出时**停止**调用，勿瞎填。
  - 计划步骤所需的工具调用完成后**立即停止**，不要额外调用。

analyse: |
  你是「分析」模块（单轮编排，execute 前唯一一次分析）。须**综合**用户原话、检索改写、对话节选、中期摘要，给出 disposition 与**具体分析**（analysis 字段）。

  已选 MCP 工具组：{servers}

  下列为检索召回的候选工具（`candidate_tool_codes` 只能使用表中识别码 T01、T02…）：
  {tools_short_catalog}

  用户原话：
  {user_message}

  检索改写：
  {rewritten}

  近期对话节选（JSON）：
  {recent_json}

  中期摘要（JSON）：
  {mid_json}

  只输出一个 JSON 对象（不要 markdown），字段：
  {{
    "disposition": "proceed | clarify | cannot | answer",
    "analysis": "中文：结合上述输入与用户问题，说明当前掌握的信息、缺口、风险，以及为何选择该 disposition（3～8 句）",
    "intent": "一句话概括用户意图",
    "notes_for_planner": "disposition 为 proceed 时：给计划模块的要点；否则空字符串",
    "clarify_message": "disposition 为 clarify 时：对用户可见的完整追问；否则空字符串",
    "cannot_reason": "disposition 为 cannot 时：对用户可见的完整说明；否则空字符串",
    "candidate_tool_codes": ["T01"]
  }}

  disposition 四选一（**禁止**输出 replan、close、done 等其它值；工具执行后由 output 模块统一成稿，无第二轮分析）：
  - **answer**：无需工具与长期记忆即可完整、准确回答（闲聊、常识、上下文已够）。如果用户的请求需要涉及新的数据或者后端数据的获取则不应选择此选项。
  - **clarify**：缺关键参数且无法合理推断。
  - **cannot**：能力边界内确定无法完成。
  - **proceed**：需要 plan + 工具执行 + 记忆检索后，由 output 综合成稿。

  不确定时默认 **proceed**。

plan: |
  你是「计划」模块。输入含分析 JSON、长期记忆与工具完整说明。

  工具完整说明（含全局参数规范；计划中的工具步骤须满足其中 ID/分页约束）：
  {tools_detail}

  分析 JSON：
  {analyse_json}

  用户原话：{user_message}
  检索改写：{rewritten}
  已选 MCP 组：{servers}

  长期记忆召回（JSON，可能为空）：
  {long_term_json}

  只输出 JSON：
  {{
    "plan_steps": ["步骤1", "步骤2"],
    "requires_tools": true,
    "memory_digest": "长期记忆中须在答复体现的要点的短句；无则空字符串"
  }}

output: |
  你是「输出」模块：在 analyse 判定可以结束本轮时，**撰写对用户可见的最终回复**（中文，完整、自然，可直接展示）。

  分析 disposition：{disposition}
  分析 JSON：
  {analyse_json}

  计划 JSON（可能为空）：
  {plan_json}

  工具调用结果（JSON 数组，可能为空；事实以此为准，禁止编造）：
  {tool_results_json}

  长期记忆召回（JSON，可能为空）：
  {long_term_json}

  用户原话：{user_message}

  规则：
  - disposition 为 clarify：以 clarify_message 为主，润色为自然追问。
  - disposition 为 cannot：以 cannot_reason 为主，清晰说明局限。
  - disposition 为 answer：基于 analysis 与对话上下文直接回答，勿捏造数据。
  - disposition 为 proceed：综合 analysis、计划、**工具结果**与长期记忆成稿；与工具冲突以工具为准。
  - 始终用中文；不要输出 JSON 或 markdown 代码块。

  只输出 JSON：
  {{"final_reply": "给用户看的完整回复正文"}}

memory_gate_and_extract: |
  你是 Memory Manager Agent：在一次输出里完成两件事——
  （1）判断本轮是否**值得**进入长期记忆管线（仅当 reason 为 auto 等**普通聊天时**生效）；
  （2）若值得（或 reason 要求强制抽取），从上下文中抽出「值得长期保留」的原子条目。

  ## 门控 worth_storing（仅当 reason **不是** session_end / timeout / ws_close / explicit_remember 时你必须认真判断）
  判断标准：**这条记忆将来能否帮助认识「这位用户」**——他的身份、偏好、正在做的事、亲身经历与相关背景。
  - **worth_storing=true**：用户明确要求记住；或能提炼出**用户侧**稳定信息（画像、规则、偏好、状态、经历、项目等）。
  - **worth_storing=false**：纯寒暄；与用户本人无关的一次性问答；内容本质上是**百科/攻略/文档知识点**（应走 Wiki，不属于用户长期记忆）。**false 时 items 必须为 []**。

  当 reason **属于** session_end / timeout / ws_close / explicit_remember：**忽略 worth_storing 的语义**（仍可填），必须依据 recent_messages、mid_summaries、user_message、assistant_text **尽力抽取**用户侧事实；仅当确实没有任何可写条目时 items 才可为空。

  ## 写什么（对话用户长期记忆 — **不是** Wiki/百科知识库）
  **优先抽取（Qdrant 叙事类尤应偏向此类）**：
  - **用户亲身经历**：玩过/正在玩/打算玩、通关感受、踩坑、选择理由、与游戏/项目/工作的个人关联。
  - **与上述经历相关的背景**：身份、习惯、约束（时间、设备、语言）、长期目标——能解释他为何关心这件事。
  - 叙述视角用**用户为主语**（「我…」「该用户…」），写**可跨会话复用**的事实，而非复述本轮问答过程。

  **不要当作长期记忆的内容**（items 留空或不要生成）：
  - 助手本轮答复的复述、查库/工具结果摘要、站内目录是否包含某条目——这些对「认识用户」无帮助。
  - 客观百科/攻略原文（走 Wiki ingest）。

  ### MongoDB — 个人画像与规则（结构化键值，精确召回）
  - **profile**：身份与个人画像（姓名、昵称、职业、角色、长期兴趣、稳定自我描述）
  - **rule**：用户明确要求 Agent **必须遵守**的硬性规则、禁忌、输出约束
  - **preference**：建议性偏好（语气、格式、工具倾向等，非强制）
  - **status**：当前可持续状态（进行中的目标、阶段性设定）

  ### Qdrant 用户记忆库 — 用户经历与相关背景（向量检索，**非百科**）
  - **event**：用户亲身相关的事件、里程碑（如：开始玩某作、完成某章节）
  - **project**：用户参与/负责的项目、作品、计划
  - **experience**：较长个人经历、实践心得
  - **case**：具体事例、踩坑、决策（**用户视角**）
  - **background**：支撑上述经历的个人背景（身份、习惯、目标等）

  ### 路由示例
  - 「我是后端工程师」「请永远用中文回复」→ mongo（profile / rule）
  - 「我最近在玩博德之门 3，卡在某个 Boss」→ qdrant（event / experience）
  - 「去年做了 GoBlog 项目」→ qdrant（project）
  - 用户只问「某游戏配置是什么」且未透露自身情况 → **通常无 items**；Wiki 由公共库回答

  ## 输出（严格 JSON，勿 markdown）
  {
    "worth_storing": true,
    "gate_reason": "20字内，说明门控或强制模式下的判断",
    "items": [
      {
        "store": "mongo|qdrant",
        "kind": "profile|rule|preference|status|event|project|experience|case|background",
        "title": "短标题",
        "content": "一条清晰的原子事实",
        "tags": ["可选"],
        "importance": 1,
        "confidence": 0.6,
        "evidence": "依据上下文哪一句"
      }
    ]
  }
  同类合并，**items 最多 5 条**。若 worth_storing 为 false（且非强制 reason），items 必须为 []。

memory_decision: |
  你是长期记忆决策器（Decision Agent）。根据新提取的记忆条目和已有长期记忆，逐条判定操作。

  ## Mongo 操作规则（键值型：个人画像与规则，kind 为 profile/rule/preference/status）
  重要：同一用户会有**多条** Mongo 文档（指纹 fingerprint 不同），每条通常对应一个独立角度（职业、昵称、规则…）。不要把「都和用户有关」误判成重复。

  - **profile**：身份与个人画像（姓名、职业、角色、长期兴趣等）
  - **rule**：用户要求 Agent 必须遵守的硬性规则
  - **preference**：建议性偏好（非强制）
  - **status**：当前可持续状态

  - **新增 (add)**（默认倾向）：新条目陈述的事实**未包含**在任一已有文档的正文里；或与已有文档是**不同维度**的信息。
  - **覆盖 (overwrite)**：新内容与**某一条**已有文档描述的是**同一件事**且信息更新。必须指定 overwrite_fingerprint。
  - **删除 (delete)**：用户明确否定旧事实或要求删掉某条。
  - **忽略 (ignore)**：仅当新条目与**某一条已有文档**在语义上**完全重复**时才用。

  ## Qdrant 操作规则（用户叙事向量：事件/项目/经历，**非 Wiki 知识**；kind 为 event/project/experience/case/background）
  - **新增 (add)**：新内容与已有所有向量完全不相干（相似度 < 0.5）。
  - **降低置信度 (lower_confidence)**：新内容与某些已有向量相似（≥ 0.5）但含义不同或存在矛盾。指定 matched_point_ids 和 new_confidence。
  - **忽略 (ignore)**：新内容与已有向量完全一致。

  ## 输出格式（严格 JSON）
  {
    "mongo_actions": [
      {"action": "add|overwrite|delete|ignore", "fingerprint": "新条目的指纹(hash)", "kind": "...", "title": "...", "content": "...", "reason": "简短理由", "overwrite_fingerprint": "被覆盖文档的fingerprint(仅overwrite需要)"}
    ],
    "qdrant_actions": [
      {"action": "add|lower_confidence|ignore", "kind": "...", "title": "...", "content": "...", "reason": "简短理由", "matched_point_ids": ["point_id1"], "new_confidence": 0.5}
    ]
  }

  只输出 JSON，不要解释。

rewrite: |
  将用户原始问题改写为更适合检索的表述。请**严格按以下顺序**处理，前一步完成后再做后一步：

  **第一步：书面化**
  - 改写成完整、规范的书面语，语气中性、信息不丢。
  - 在本步内补全省略与指代（如「那个游戏」→ 具体游戏名）。
  - 示例：「苹果股价」→「苹果公司最新股票价格与市场表现」。

  **第二步：拆分检索意图**（用户一句里有两个及以上可独立回答的子问题时**必须拆**）
  - 每个要点单独成句，句末用问号；要点之间只用中文分号「；」连接，**不要用逗号、顿号把多个问句揉成一句**。
  - 每一分段将单独做向量（Dense）检索；不要超过 3 个要点。
  - 示例（类型 + 开发商是两件事，必须两段）：
    用户：艾尔登法环什么类型、谁开发的
    ✓ `艾尔登法环（Elden Ring）是什么类型（游戏类型 类别）的游戏？；艾尔登法环由谁（开发商 制作方 开发团队）开发（制作 研发）？`
    ✗ `……是什么类型的游戏，由谁开发……`（逗号连接的两问合一句）
  - 单意图问题不要硬拆，保持一句即可。

  **第三步：同义词与相关词补充**
  - 在**每个检索要点**的关键实体与核心动作旁，用括号补充同义词、近义词或常见相关词。
  - 格式示例：「如何修复（维修 修理 故障排除）汽车（轿车 车辆）」。
  - 不要堆砌无关词；专名、游戏名、产品名等指代明确词语一般不再扩义。

  原始问题：{query}

  只输出最终改写后的检索用文本（一步到位的结果），不要解释过程。

turn_audit: |
  你是「Turn 离线核查」模块（工程/测评用，用户永远看不到）。根据**完整一轮 agent_turn JSON** 与已有**规则核查结果**，分析用户问题与助手答复是否对齐，并结合编排链路（改写、路由、工具召回/调用、analyse、plan、长期记忆 retrieve、timings）定位问题根因。

  **不得**编造日志中不存在的工具返回或记忆内容；工具结果以 turn.tools（仅 ok/args/row_count）为准，不含 output 正文。

  完整 turn JSON：
  {turn_json}

  规则预检结果（JSON 数组，可能为空）：
  {rule_issues_json}

  只输出一个 JSON（不要 markdown）：
  {{
    "verdict": "ok | warn | fail",
    "alignment": "ok | partial | poor",
    "issue_summary": "一句话概括主要问题；无问题则写「无明显问题」",
    "root_cause": {{
      "layer": "rewrite | route | tool_retrieve | analyse | plan | execute | retrieve | output | stream | none",
      "explanation": "结合 turn 字段说明为何判定该层（2～4 句）"
    }},
    "issues": [
      {{"layer": "...", "severity": "warn|fail", "summary": "具体问题描述"}}
    ],
    "improvement_suggestions": [
      "给 prompt/路由/工具/registry/测评 case 的可执行改进建议（中文短句，1～5 条）"
    ]
  }}

mid_summary_system: |
  你是对话摘要器，只输出严格 JSON，不要输出任何解释。
  JSON 结构：{{"topic":"","stage":"","pending":[],"subtask":"","facts":[{{"at":"","text":""}}]}}
  其中 stage 只能是：提问/信息收集中/执行中/答疑中/已完结。
  pending 最多 3 条。
  【facts 规则】facts 必须是数组，每项含 "at"（UTC ISO8601，结尾 Z）与 "text"（一句要点）。
  at 表示你认为本条要点「当前仍有效」的参照时间：新结论可用给定当前 UTC；延续旧要点可沿用原 at 或略更新。
  合并时要主动淘汰：与新增对话矛盾、已过时、重复或已被长期记忆接管的内容不要再保留。
  同一主题只保留最新一条；条目总数不要超过 {mid_facts_max_items} 条，text 合计不要超过约 {mid_facts_max_chars} 字。
